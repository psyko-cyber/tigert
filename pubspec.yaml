name: tigert
description: "Tigert - allenamento e nutrizione"
publish_to: 'none'

version: 1.7.0+10

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  path_provider: ^2.1.6
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  window_manager: ^0.5.2
  # 0.7+ si porta dietro nativeapi (FFI) anche su Android
  tray_manager: 0.5.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.8.0
  image: ^4.10.1
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/icon_full.png"
  min_sdk_android: 24
  adaptive_icon_background: "#C6F24E"
  adaptive_icon_foreground: "assets/brand/icon_fg.png"
  adaptive_icon_monochrome: "assets/brand/icon_mono.png"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/mark.png
    - assets/brand/tray.ico
    - assets/data/

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-400.ttf
          weight: 400
        - asset: assets/fonts/Archivo-500.ttf
          weight: 500
        - asset: assets/fonts/Archivo-600.ttf
          weight: 600
        - asset: assets/fonts/Archivo-700.ttf
          weight: 700
        - asset: assets/fonts/Archivo-800.ttf
          weight: 800
